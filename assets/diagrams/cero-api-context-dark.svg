  <title>Cero API system context</title>
  <desc>A developer runs the contract suite and a RETO client calls REST or GraphQL against Cero API, whose sixteen implementations store tasks and focus sessions in MongoDB, PostgreSQL, Firebase or Supabase.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
