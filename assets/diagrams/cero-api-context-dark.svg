    <text class="ts" x="440" y="202" text-anchor="middle" dominant-baseline="central">16 implementations, one API contract</text></g>

  <path class="arr" d="M440 230 V262"/>
  <text class="ts" x="452" y="246" dominant-baseline="central">stores tasks and sessions</text>
  <path class="arr" d="M125 262 H755"/>
  <path class="arr" d="M125 262 V300" marker-end="url(#a)"/>
  <path class="arr" d="M335 262 V300" marker-end="url(#a)"/>
