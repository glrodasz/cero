  <g class="s-gray"><rect x="490" y="30" width="220" height="56" rx="8"/>
    <text class="th" x="600" y="50" text-anchor="middle" dominant-baseline="central">RETO client</text>
    <text class="ts" x="600" y="68" text-anchor="middle" dominant-baseline="central">Tasks and focus sessions</text></g>

  <path class="arr" d="M280 86 V150" marker-end="url(#a)"/>
