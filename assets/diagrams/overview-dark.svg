  <title>Cero system overview</title>
  <desc>The cero-components UI kit is published to npm and used by cero-web, the RETO web app, which a person uses to plan and focus. cero-web stores data in the browser or json-server today and can point at any backend with the same REST contract, such as cero-api, whose implementations store data in MongoDB, PostgreSQL, Firestore or Supabase.</desc>
  <defs>
