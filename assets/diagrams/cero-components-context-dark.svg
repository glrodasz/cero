<title>@glrodasz/components system context (C4 level 1)</title>
<desc>The maintainer builds the UI kit live on stream and a front-end developer installs it and browses its Storybook. The kit publishes releases to npm, deploys its Storybook to Vercel and publishes visual snapshots to Chromatic; the RETO web app, cero-web, uses its components.</desc>
